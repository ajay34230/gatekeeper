name: Build APK and Windows installer

on:
  push:
    branches-ignore: [ci-screenshots, ci-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build headless server
        run: dotnet build windows/src/XV.Server -c Release
      - name: End-to-end encrypted protocol test
        run: |
          pip install pycryptodome requests websocket-client
          mkdir -p /tmp/xv && cd /tmp/xv
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll \
            --create-operator "Test Operator" GK-01 "Operator#1" \
            --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv --import-vehicles $GITHUB_WORKSPACE/windows/tests/sample/vehicles.csv \
            --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" \
            --add-visitor "CI Visitor" -5 120 --add-visitor "CI Expired Visitor" -120 -60 \
            --pair --comms-test-echo --ci-control > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done; cat srv.log
          XV_SRV_LOG=/tmp/xv/srv.log XV_CI_DATA=/tmp/xv python3 $GITHUB_WORKSPACE/windows/tests/e2e_protocol_test.py "$(grep PAIRQR srv.log | cut -d' ' -f2)"
          # Leave tracking: the TD exit with a past return date must be listed as overdue
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --absences --verify-audit | tee abs.txt
          grep -q "ABSENCE P001 RETURN reason=TD overdue=True" abs.txt
          grep -q "AUDIT .* 0 problem" abs.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build ID Card Studio (offline web UI hosted by the Command Center)
        working-directory: windows/idstudio
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish Command Center (self-contained x64)
        run: dotnet publish windows/src/XV.CommandCenter -c Release -r win-x64 --self-contained true -o windows/dist/app
      - name: Screenshots of the real app (CI test data only)
        shell: pwsh
        run: |
          $env:XV_DATA_DIR = "$env:RUNNER_TEMP\xvshot"
          dotnet build windows/src/XV.Server -c Release
          dotnet windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --create-operator "CI Operator" GK-01 "Operator#1" --import-persons windows/tests/sample/persons.csv --import-vehicles windows/tests/sample/vehicles.csv --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" --add-record P001 ENTRY "CI test record" --add-record P002 Leave "CI test record" --add-visitor "CI Test Visitor" -5 480 --add-visitor "CI Ended Visitor" -300 -60 --report-lost P002 --set-photo P001 windows/tests/sample/ci-photo.png
          $a = Start-Process windows/dist/app/XVCommandCenter.exe -ArgumentList "--screenshot","$env:GITHUB_WORKSPACE\screenshots" -PassThru
          if (-not $a.WaitForExit(120000)) { Stop-Process -Id $a.Id -Force; throw "app did not finish" }
          Get-ChildItem screenshots
          if (Test-Path "$env:XV_DATA_DIR\error.log") { Get-Content "$env:XV_DATA_DIR\error.log"; throw "app logged errors" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DSRC=..\dist\app /DVERSION=1.0.0 windows\installer\XVCommandCenter.nsi
      - uses: actions/upload-artifact@v4
        with: { name: XV-CommandCenter-Setup, path: windows/installer/XV-CommandCenter-Setup-*.exe }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: screenshots }
      - name: Publish screenshots to the ci-screenshots branch
        shell: pwsh
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rf --cached . | Out-Null
          git add -f screenshots
          git commit -m "Windows screenshots for ${{ github.sha }}"
          git push -f origin ci-screenshots

  android-device-test:
    # The real app on an Android emulator with the real encrypted database: scan → entry, exit on leave with the date
    # picker, expired visitor pass, night mode + Hindi, shift handover. Fails with the crash log if the app crashes.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs (with x86_64 libraries for the emulator)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -PxvEmulator :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          working-directory: android
          script: adb logcat -c; ./gradlew --no-daemon -PxvEmulator :app:connectedDebugAndroidTest || { adb logcat -d > /tmp/logcat.txt; grep -n -E "FATAL EXCEPTION|AndroidRuntime|XV-GATE|Caused by|at com\.teamxv" /tmp/logcat.txt | head -300; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-device-test-report, path: android/app/build/reports/androidTests }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        working-directory: android
        env:
          # Optional repository secrets for a stable release signature (see README → Security).
          XV_KEYSTORE_B64: ${{ secrets.XV_KEYSTORE_B64 }}
          XV_KEYSTORE_PASSWORD: ${{ secrets.XV_KEYSTORE_PASSWORD }}
          XV_KEY_ALIAS: ${{ secrets.XV_KEY_ALIAS }}
          XV_KEY_PASSWORD: ${{ secrets.XV_KEY_PASSWORD }}
        run: |
          if [ -n "$XV_KEYSTORE_B64" ]; then echo "$XV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xv-release.jks"; export XV_KEYSTORE_FILE="$RUNNER_TEMP/xv-release.jks"; fi
          chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          rm -f "$RUNNER_TEMP/xv-release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: XV-Gatekeeper-APK, path: android/app/build/outputs/apk/release/*.apk }
      - name: Publish APK to the ci-apk branch
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/XV-Gatekeeper.apk
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-apk
          git rm -rf --cached . > /dev/null
          cp /tmp/apk/XV-Gatekeeper.apk .
          git add -f XV-Gatekeeper.apk
          git commit -m "APK for ${{ github.sha }}"
          git push -f origin ci-apk
