name: Build APK and Windows installer

on:
  push:
    branches-ignore: [ci-screenshots, ci-apk]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces builds still running for older commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build headless server
        run: dotnet build windows/src/XV.Server -c Release
      - name: End-to-end encrypted protocol test
        run: |
          pip install pycryptodome requests websocket-client
          mkdir -p /tmp/xv && cd /tmp/xv
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll \
            --create-operator "Test Operator" GK-01 "Operator#1" \
            --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv --import-vehicles $GITHUB_WORKSPACE/windows/tests/sample/vehicles.csv \
            --add-location LOC07 "Location 07" --add-location LOC08 "Location 08" --add-gate G02 "Gate 02" \
            --add-visitor "CI Visitor" -5 120 --add-visitor "CI Expired Visitor" -120 -60 \
            --pair --comms-test-echo --ci-control > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done; cat srv.log
          XV_DATA_DIR=/tmp/xv XV_SERVER_DLL=$GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll XV_SRV_LOG=/tmp/xv/srv.log XV_CI_DATA=/tmp/xv python3 $GITHUB_WORKSPACE/windows/tests/e2e_protocol_test.py "$(grep PAIRQR srv.log | cut -d' ' -f2)"
          # Leave tracking: the TD exit with a past return date must be listed as overdue
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --absences --verify-audit | tee abs.txt
          grep -q "ABSENCE P001 RETURN reason=TD overdue=True" abs.txt
          grep -q "AUDIT .* 0 problem" abs.txt
          # Vehicle transit: the destination RP's trip was closed only by the RP's entry, never assumed; scans close the others
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --transits | tee tr.txt
          grep -q "TRANSIT V014 LOC07>LOC08 REACHED via=RP min=45" tr.txt
          grep -q "TRANSIT V014 LOC07>Ammo Depot DIVERTED via=SCAN" tr.txt
          grep -q "TRANSIT V014 LOC08>LOC07 REACHED via=SCAN min=25" tr.txt
          grep -q "ROUTE LOC07>LOC08 30 RP" tr.txt
      - name: Cloud Link test through a free Cloudflare tunnel (terminal reaches the PC only via the internet)
        continue-on-error: true
        run: |
          pkill -f XV.Server.dll || true; fuser -k 8443/tcp 8444/tcp 47913/udp 2>/dev/null || true; sleep 3
          curl -sSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8443 --no-tls-verify > /tmp/t1.log 2>&1 &
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8444 --no-tls-verify > /tmp/t2.log 2>&1 &
          for i in $(seq 1 90); do U1=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t1.log | head -1); U2=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t2.log | head -1); [ -n "$U1" ] && [ -n "$U2" ] && break; sleep 1; done
          echo "Cloud Link: $U1 (gate)  $U2 (comms)"; test -n "$U1" && test -n "$U2"
          mkdir -p /tmp/xvc && cd /tmp/xvc
          XV_DATA_DIR=/tmp/xvc dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --cloud-url "$U1" --comms-cloud-url "$U2" \
            --create-operator "Test Operator" GK-01 "Operator#1" --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv \
            --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" --pair > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done
          python3 $GITHUB_WORKSPACE/windows/tests/cloud_link_test.py "$(grep PAIRQR srv.log | cut -d' ' -f2)" || { cat srv.log | tail -30; exit 1; }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build ID Card Studio (offline web UI hosted by the Command Center)
        working-directory: windows/idstudio
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish Command Center (self-contained x64)
        run: dotnet publish windows/src/XV.CommandCenter -c Release -r win-x64 --self-contained true -p:Version=1.0.${{ github.run_number }} -o windows/dist/app

      # Optional screenshots step: will safely continue to installer if headless timeout occurs
      - name: Screenshots of the real app (CI test data only)
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "screenshots" | Out-Null
          $env:XV_DATA_DIR = "$env:RUNNER_TEMP\xvshot"
          dotnet build windows/src/XV.Server -c Release
          dotnet windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --create-operator "CI Operator" GK-01 "Operator#1" --import-persons windows/tests/sample/persons.csv --import-vehicles windows/tests/sample/vehicles.csv --add-location LOC07 "Location 07" --add-location LOC08 "Location 08" --add-gate G02 "Gate 02" --add-leave P002 "Proceeding on Leave" 6 1 --add-trip V014 LOC07 LOC08 700 30 42 --add-trip V014 LOC08 LOC07 600 25 31 --add-vehicle-trip V014 P002 LOC07 LOC08 240 90 30 --add-record P001 ENTRY "CI test record" --add-record P002 Leave "CI test record" --add-visitor "CI Test Visitor" -5 480 --add-visitor "CI Ended Visitor" -300 -60 --report-lost P002 --set-photo P001 windows/tests/sample/ci-photo.png
          $a = Start-Process windows/dist/app/XVCommandCenter.exe -ArgumentList "--screenshot","$env:GITHUB_WORKSPACE\screenshots" -PassThru
          if (-not $a.WaitForExit(150000)) { 
            Stop-Process -Id $a.Id -Force
            Write-Host "Screenshot step skipped on headless runner."
          }
          if (Test-Path "$env:XV_DATA_DIR\error.log") { Get-Content "$env:XV_DATA_DIR\error.log" }

      - name: Bundle guide screenshots and build the PDF guide
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "screenshots/*.png") {
            New-Item -ItemType Directory -Force -Path "windows/dist/app/guide-shots" | Out-Null
            Copy-Item "screenshots/*.png" "windows/dist/app/guide-shots"
            $env:XV_DATA_DIR = "$env:RUNNER_TEMP\xvguide"
            dotnet windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --guide screenshots/XV-User-Guide.pdf screenshots
          }

      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DSRC=..\dist\app /DVERSION=1.0.${{ github.run_number }} windows\installer\XVCommandCenter.nsi

      - name: Upload Windows Installer (.exe)
        uses: actions/upload-artifact@v4
        with: 
          name: XV-CommandCenter-Setup
          path: windows/installer/XV-CommandCenter-Setup-*.exe

      - name: Upload Standalone App Executable (Direct .exe without installer)
        uses: actions/upload-artifact@v4
        with:
          name: XV-CommandCenter-Standalone-x64
          path: windows/dist/app/

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with: { name: windows-screenshots, path: screenshots }

      - name: Publish screenshots to the ci-screenshots branch
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "screenshots/*") {
            git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
            git checkout --orphan ci-screenshots
            git rm -rf --cached . | Out-Null
            git add -f screenshots
            git commit -m "Windows screenshots for ${{ github.sha }}"
            git push -f origin ci-screenshots
          }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        working-directory: android
        env:
          XV_KEYSTORE_B64: ${{ secrets.XV_KEYSTORE_B64 }}
          XV_KEYSTORE_PASSWORD: ${{ secrets.XV_KEYSTORE_PASSWORD }}
          XV_KEY_ALIAS: ${{ secrets.XV_KEY_ALIAS }}
          XV_KEY_PASSWORD: ${{ secrets.XV_KEY_PASSWORD }}
        run: |
          if [ -n "$XV_KEYSTORE_B64" ]; then echo "$XV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xv-release.jks"; export XV_KEYSTORE_FILE="$RUNNER_TEMP/xv-release.jks"; fi
          chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          rm -f "$RUNNER_TEMP/xv-release.jks"
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with: 
          name: XV-Gatekeeper-APK
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish APK to the ci-apk branch
        continue-on-error: true
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/XV-Gatekeeper.apk || cp android/app/build/outputs/apk/debug/*.apk /tmp/apk/XV-Gatekeeper.apk
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-apk
          git rm -rf --cached . > /dev/null
          cp /tmp/apk/XV-Gatekeeper.apk .
          git add -f XV-Gatekeeper.apk
          git commit -m "APK for ${{ github.sha }}"
          git push -f origin ci-apk
