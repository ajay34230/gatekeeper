name: Build APK and Windows installer

on:
  push:
    branches-ignore: [ci-screenshots, ci-apk]
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces builds still running for older commits.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build headless server
        run: dotnet build windows/src/XV.Server -c Release
      - name: End-to-end encrypted protocol test
        run: |
          pip install pycryptodome requests websocket-client
          mkdir -p /tmp/xv && cd /tmp/xv
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll \
            --create-operator "Test Operator" GK-01 "Operator#1" \
            --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv --import-vehicles $GITHUB_WORKSPACE/windows/tests/sample/vehicles.csv \
            --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" \
            --add-visitor "CI Visitor" -5 120 --add-visitor "CI Expired Visitor" -120 -60 \
            --pair --comms-test-echo --ci-control > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done; cat srv.log
          XV_SRV_LOG=/tmp/xv/srv.log XV_CI_DATA=/tmp/xv python3 $GITHUB_WORKSPACE/windows/tests/e2e_protocol_test.py "$(grep PAIRQR srv.log | cut -d' ' -f2)"
          # Leave tracking: the TD exit with a past return date must be listed as overdue
          XV_DATA_DIR=/tmp/xv dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --absences --verify-audit | tee abs.txt
          grep -q "ABSENCE P001 RETURN reason=TD overdue=True" abs.txt
          grep -q "AUDIT .* 0 problem" abs.txt
      - name: Cloud Link test through a free Cloudflare tunnel (terminal reaches the PC only via the internet)
        run: |
          pkill -f XV.Server.dll || true; sleep 2
          curl -sSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8443 --no-tls-verify > /tmp/t1.log 2>&1 &
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8444 --no-tls-verify > /tmp/t2.log 2>&1 &
          for i in $(seq 1 90); do U1=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t1.log | head -1); U2=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t2.log | head -1); [ -n "$U1" ] && [ -n "$U2" ] && break; sleep 1; done
          echo "Cloud Link: $U1 (gate)  $U2 (comms)"; test -n "$U1" && test -n "$U2"
          mkdir -p /tmp/xvc && cd /tmp/xvc
          XV_DATA_DIR=/tmp/xvc dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --cloud-url "$U1" --comms-cloud-url "$U2" \
            --create-operator "Test Operator" GK-01 "Operator#1" --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv \
            --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" --pair > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done
          python3 $GITHUB_WORKSPACE/windows/tests/cloud_link_test.py "$(grep PAIRQR srv.log | cut -d' ' -f2)"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build ID Card Studio (offline web UI hosted by the Command Center)
        working-directory: windows/idstudio
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Publish Command Center (self-contained x64)
        run: dotnet publish windows/src/XV.CommandCenter -c Release -r win-x64 --self-contained true -p:Version=1.0.${{ github.run_number }} -o windows/dist/app
      - name: Screenshots of the real app (CI test data only)
        shell: pwsh
        run: |
          $env:XV_DATA_DIR = "$env:RUNNER_TEMP\xvshot"
          dotnet build windows/src/XV.Server -c Release
          dotnet windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --setup-only --create-operator "CI Operator" GK-01 "Operator#1" --import-persons windows/tests/sample/persons.csv --import-vehicles windows/tests/sample/vehicles.csv --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" --add-record P001 ENTRY "CI test record" --add-record P002 Leave "CI test record" --add-visitor "CI Test Visitor" -5 480 --add-visitor "CI Ended Visitor" -300 -60 --report-lost P002 --set-photo P001 windows/tests/sample/ci-photo.png
          $a = Start-Process windows/dist/app/XVCommandCenter.exe -ArgumentList "--screenshot","$env:GITHUB_WORKSPACE\screenshots" -PassThru
          if (-not $a.WaitForExit(120000)) { Stop-Process -Id $a.Id -Force; throw "app did not finish" }
          Get-ChildItem screenshots
          if (Test-Path "$env:XV_DATA_DIR\error.log") { Get-Content "$env:XV_DATA_DIR\error.log"; throw "app logged errors" }
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DSRC=..\dist\app /DVERSION=1.0.${{ github.run_number }} windows\installer\XVCommandCenter.nsi
      - uses: actions/upload-artifact@v4
        with: { name: XV-CommandCenter-Setup, path: windows/installer/XV-CommandCenter-Setup-*.exe }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: windows-screenshots, path: screenshots }
      - name: Publish screenshots to the ci-screenshots branch
        shell: pwsh
        run: |
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-screenshots
          git rm -rf --cached . | Out-Null
          git add -f screenshots
          git commit -m "Windows screenshots for ${{ github.sha }}"
          git push -f origin ci-screenshots

  android-device-test:
    # The real app on an Android emulator with the real encrypted database: scan → entry, exit on leave with the date
    # picker, expired visitor pass, night mode + Hindi, shift handover. Fails with the crash log if the app crashes.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Free disk space for the emulator
        run: sudo rm -rf /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Command Center (headless) behind a free Cloudflare tunnel for the Cloud Link test
        run: |
          dotnet build windows/src/XV.Server -c Release -v q
          curl -sSL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 && chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8443 --no-tls-verify > /tmp/t1.log 2>&1 &
          /tmp/cloudflared tunnel --no-autoupdate --url https://localhost:8444 --no-tls-verify > /tmp/t2.log 2>&1 &
          for i in $(seq 1 90); do U1=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t1.log | head -1); U2=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/t2.log | head -1); [ -n "$U1" ] && [ -n "$U2" ] && break; sleep 1; done
          echo "Cloud Link: $U1 (gate)  $U2 (comms)"; test -n "$U1" && test -n "$U2"
          mkdir -p /tmp/xvd && cd /tmp/xvd
          XV_DATA_DIR=/tmp/xvd nohup dotnet $GITHUB_WORKSPACE/windows/src/XV.Server/bin/Release/net8.0/XV.Server.dll --cloud-url "$U1" --comms-cloud-url "$U2" \
            --create-operator "Test Operator" GK-01 "Operator#1" --import-persons $GITHUB_WORKSPACE/windows/tests/sample/persons.csv \
            --add-location LOC07 "Location 07" --add-gate G02 "Gate 02" --pair --comms-test-echo > srv.log 2>&1 &
          for i in $(seq 1 60); do grep -q PAIRQR srv.log && break; sleep 1; done
          echo "PAIRQR=$(grep PAIRQR srv.log | cut -d' ' -f2)" >> $GITHUB_ENV
          for i in $(seq 1 30); do curl -fsS "$U1/api/v1/ping" && break; sleep 2; done
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs (with x86_64 libraries for the emulator)
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon -PxvEmulator :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Run on-device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          ram-size: 3072M
          disk-size: 6000M
          cores: 2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front none
          working-directory: android
          script: |
            adb logcat -c; ./gradlew --no-daemon -PxvEmulator "-Pandroid.testInstrumentationRunnerArguments.pairQr=$PAIRQR" :app:connectedDebugAndroidTest || { adb logcat -d > /tmp/logcat.txt; grep -n -E "FATAL EXCEPTION|XV-GATE|XV-APP|TestRunner|AssertionError|ComposeTimeout|at com\.teamxv" /tmp/logcat.txt | head -300; exit 1; }
            adb install -r app/build/outputs/apk/release/app-release.apk && adb logcat -c && adb shell monkey -p com.xv.accesscontrol --pct-syskeys 0 --throttle 250 -s 42 -v 1500 > /tmp/monkey.txt 2>&1; tail -5 /tmp/monkey.txt; adb logcat -d > /tmp/rel.txt; if grep -q -E "FATAL EXCEPTION|// CRASH|ANR in com.xv" /tmp/monkey.txt /tmp/rel.txt; then grep -n -A30 -E "FATAL EXCEPTION|// CRASH|ANR in" /tmp/monkey.txt /tmp/rel.txt | head -200; exit 1; fi; echo "release build: no crash in 1500 random actions"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-device-test-report, path: android/app/build/reports/androidTests }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        working-directory: android
        env:
          # Optional repository secrets for a stable release signature (see README → Security).
          XV_KEYSTORE_B64: ${{ secrets.XV_KEYSTORE_B64 }}
          XV_KEYSTORE_PASSWORD: ${{ secrets.XV_KEYSTORE_PASSWORD }}
          XV_KEY_ALIAS: ${{ secrets.XV_KEY_ALIAS }}
          XV_KEY_PASSWORD: ${{ secrets.XV_KEY_PASSWORD }}
        run: |
          if [ -n "$XV_KEYSTORE_B64" ]; then echo "$XV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xv-release.jks"; export XV_KEYSTORE_FILE="$RUNNER_TEMP/xv-release.jks"; fi
          chmod +x gradlew && ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
          rm -f "$RUNNER_TEMP/xv-release.jks"
      - uses: actions/upload-artifact@v4
        with: { name: XV-Gatekeeper-APK, path: android/app/build/outputs/apk/release/*.apk }
      - name: Publish APK to the ci-apk branch
        run: |
          mkdir -p /tmp/apk && cp android/app/build/outputs/apk/release/*.apk /tmp/apk/XV-Gatekeeper.apk
          git config user.name "ci-bot"; git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-apk
          git rm -rf --cached . > /dev/null
          cp /tmp/apk/XV-Gatekeeper.apk .
          git add -f XV-Gatekeeper.apk
          git commit -m "APK for ${{ github.sha }}"
          git push -f origin ci-apk
